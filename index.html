<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>SharePoint-Teamnews</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f4f4f4;
      color: #333;
    }
    h1 {
      color: #004080;
    }
    .news-item {
      background: #fff;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }
    .news-item h2 {
      margin-top: 0;
    }
    .date {
      color: #888;
      font-size: 0.9em;
      margin-bottom: 10px;
    }
    a {
      color: #0066cc;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Neuigkeiten aus unserem Team</h1>

  <div class="news-item">
    <h2><a href="https://intranet.meinefirma.de/teamnews/meetingraum-update">
      Update Meeting-Raum-Buchungen
    </a></h2>
    <div class="date">02. Mai 2025 – 10:00 Uhr</div>
    <p>Ab sofort neue Regelungen bei Meetingraum-Buchungen beachten!</p>
  </div>

  <div class="news-item">
    <h2><a href="https://intranet.meinefirma.de/teamnews/sommerfest-2025">
      Teamevent: Sommerfest am 10. Juni!
    </a></h2>
    <div class="date">01. Mai 2025 – 12:00 Uhr</div>
    <p>Wir laden herzlich zum diesjährigen Sommerfest ein.</p>
  </div>

</body>
</html>
